<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier - Fast Food</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="interactive-hover-button.css">
    <style>
        :root {
            --green: #f46a06;
            --black: #192a56;
            --light-color: #666;
            --box-shadow: 0 .5rem 1.5rem rgba(0,0,0,.1);
        }

        * {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
            outline: none;
            border: none;
            text-transform: capitalize;
            transition: all .2s linear;
        }

        html {
            font-size: 62.5%;
            scroll-behavior: smooth;
        }

        body {
            background: #f5f5f5;
            padding-top: 80px;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #fff;
            padding: 1rem 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            box-shadow: var(--box-shadow);
        }

        header .logo {
            color: var(--black);
            font-size: 2.5rem;
            font-weight: bolder;
        }

        header .logo i {
            color: var(--green);
        }

        header .back-btn {
            color: var(--green);
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            border-radius: 5px;
            background: #eee;
        }

        header .back-btn:hover {
            background: var(--green);
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            text-align: center;
            font-size: 3.5rem;
            color: var(--black);
            margin-bottom: 3rem;
        }

        .cart-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 3rem;
        }

        .cart-items {
            background: #fff;
            border-radius: 15px;
            padding: 2.5rem;
            box-shadow: var(--box-shadow);
        }

        .empty-cart {
            text-align: center;
            padding: 5rem 2rem;
        }

        .empty-cart i {
            font-size: 8rem;
            color: #ddd;
            margin-bottom: 2rem;
        }

        .empty-cart h3 {
            font-size: 2.5rem;
            color: var(--light-color);
            margin-bottom: 1rem;
        }

        .empty-cart p {
            font-size: 1.6rem;
            color: var(--light-color);
            text-transform: none;
        }

        .empty-cart a {
            display: inline-block;
            margin-top: 2rem;
            padding: 1.2rem 3rem;
            background: var(--green);
            color: #fff;
            border-radius: 8px;
            font-size: 1.6rem;
        }

        .empty-cart a:hover {
            background: var(--black);
        }

        .cart-item {
            display: flex;
            gap: 2rem;
            padding: 2rem;
            border: 2px solid #eee;
            border-radius: 12px;
            margin-bottom: 2rem;
            position: relative;
        }

        .cart-item:hover {
            border-color: var(--green);
        }

        .cart-item img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
        }

        .item-details {
            flex: 1;
        }

        .item-details h3 {
            font-size: 2rem;
            color: var(--black);
            margin-bottom: 1rem;
        }

        .item-details p {
            font-size: 1.4rem;
            color: var(--light-color);
            margin-bottom: 1.5rem;
            text-transform: none;
        }

        .item-price {
            font-size: 2.2rem;
            color: var(--green);
            font-weight: bold;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .quantity-controls button {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--green);
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quantity-controls button:hover {
            background: var(--black);
        }

        .quantity-controls span {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--black);
            min-width: 40px;
            text-align: center;
        }

        .item-total {
            font-size: 2rem;
            color: var(--green);
            font-weight: bold;
            margin-left: auto;
        }

        .remove-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #ff4444;
            color: #fff;
            font-size: 1.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-btn:hover {
            background: #cc0000;
            transform: rotate(90deg);
        }

        .order-summary {
            background: #fff;
            border-radius: 15px;
            padding: 2.5rem;
            box-shadow: var(--box-shadow);
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .order-summary h2 {
            font-size: 2.5rem;
            color: var(--black);
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #eee;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            font-size: 1.6rem;
        }

        .summary-item span:first-child {
            color: var(--light-color);
        }

        .summary-item span:last-child {
            color: var(--black);
            font-weight: 600;
        }

        .promo-code {
            margin: 2rem 0;
            padding-top: 2rem;
            border-top: 2px dashed #eee;
        }

        .promo-code h4 {
            font-size: 1.6rem;
            color: var(--black);
            margin-bottom: 1rem;
        }

        .promo-input {
            display: flex;
            gap: 1rem;
        }

        .promo-input input {
            flex: 1;
            padding: 1.2rem;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 1.4rem;
            text-transform: none;
        }

        .promo-input button {
            padding: 1.2rem 2rem;
            background: var(--black);
            color: #fff;
            border-radius: 8px;
            font-size: 1.4rem;
            cursor: pointer;
        }

        .promo-input button:hover {
            background: var(--green);
        }

        .total {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #eee;
            display: flex;
            justify-content: space-between;
            font-size: 2.2rem;
            font-weight: bold;
        }

        .total span:last-child {
            color: var(--green);
        }





        .custom-notification {
            position: fixed;
            top: 100px;
            right: -400px;
            background: #fff;
            padding: 2rem 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            font-size: 1.6rem;
            transition: right 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            min-width: 350px;
        }

        .custom-notification.show {
            right: 30px;
        }

        .custom-notification.success {
            border-left: 5px solid #00C851;
        }

        .custom-notification.error {
            border-left: 5px solid #ff4444;
        }

        .custom-notification.warning {
            border-left: 5px solid #ffbb33;
        }

        .custom-notification.info {
            border-left: 5px solid #33b5e5;
        }

        .custom-notification i {
            font-size: 2.5rem;
        }

        @media (max-width: 991px) {
            html {
                font-size: 55%;
            }

            .cart-container {
                grid-template-columns: 1fr;
            }

            .order-summary {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .cart-item {
                flex-direction: column;
            }

            .cart-item img {
                width: 100%;
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo"><i class="fas fa-utensils"></i> Fast Food</a>
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            <span>Retour</span>
        </a>
    </header>

    <div class="container">
        <h1 class="page-title">Mon Panier</h1>

        <div class="cart-container">
            <div class="cart-items" id="cartItems"></div>

            <div class="order-summary">
                <h2>Résumé de la commande</h2>
                
                <div class="summary-item">
                    <span>Sous-total</span>
                    <span id="subtotal">0 FCFA</span>
                </div>
                
                <div class="summary-item">
                    <span>Livraison</span>
                    <span id="delivery">500 FCFA</span>
                </div>
                
                <div class="summary-item">
                    <span>Remise</span>
                    <span id="discount" style="color: #00C851;">-0 FCFA</span>
                </div>

                <div class="promo-code">
                    <h4>Code promo</h4>
                    <div class="promo-input">
                        <input type="text" placeholder="Entrer le code" id="promoInput">
                        <button onclick="applyPromo()">Appliquer</button>
                    </div>
                </div>

                <div class="total">
                    <span>Total</span>
                    <span id="total">0 FCFA</span>
                </div>

                <button type="button" class="ihb ihb--block ihb--lg ihb--mt" onclick="checkout()"><span class="ihb__label">Passer la commande</span><span class="ihb__over" aria-hidden="true"><span>Passer la commande</span><svg class="ihb__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb__dot" aria-hidden="true"></span></button>

                <a href="index.html#menu" class="ihb ihb--block ihb--mt"><span class="ihb__label">Continuer mes achats</span><span class="ihb__over" aria-hidden="true"><span>Continuer mes achats</span><svg class="ihb__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb__dot" aria-hidden="true"></span></a>
            </div>
        </div>
    </div>

    <script>
        let cartItems = JSON.parse(localStorage.getItem('fastfood_cart')) || [];
        let discountAmount = 0;
        let promoApplied = false;

        function renderCart() {
            const cartContainer = document.getElementById('cartItems');
            
            if (cartItems.length === 0) {
                cartContainer.innerHTML = `
                    <div class="empty-cart">
                        <i class="fas fa-shopping-cart"></i>
                        <h3>Votre panier est vide</h3>
                        <p>Ajoutez des plats délicieux pour commencer !</p>
                        <a href="index.html#menu">Voir le menu</a>
                    </div>
                `;
            } else {
                cartContainer.innerHTML = cartItems.map(item => `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}">
                        <div class="item-details">
                            <h3>${item.name}</h3>
                            <p>Plat délicieux préparé avec soin</p>
                            <div class="item-price">${formatPrice(item.price)} FCFA</div>
                            <div class="quantity-controls">
                                <button onclick="updateQuantity(${item.id}, -1)">
                                    <i class="fas fa-minus"></i>
                                </button>
                                <span>${item.quantity}</span>
                                <button onclick="updateQuantity(${item.id}, 1)">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                        </div>
                        <div class="item-total">
                            ${formatPrice(item.price * item.quantity)} FCFA
                        </div>
                        <button class="remove-btn" onclick="removeItem(${item.id})">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `).join('');
            }
            
            updateSummary();
        }

        function formatPrice(price) {
            return price.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function updateQuantity(id, change) {
            const item = cartItems.find(i => i.id === id);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    removeItem(id);
                } else {
                    saveCart();
                    renderCart();
                }
            }
        }

        function removeItem(id) {
            if (confirm('Voulez-vous vraiment retirer cet article du panier ?')) {
                cartItems = cartItems.filter(i => i.id !== id);
                saveCart();
                renderCart();
                showNotification('Article retiré du panier', 'info');
            }
        }

        function saveCart() {
            localStorage.setItem('fastfood_cart', JSON.stringify(cartItems));
        }

        function updateSummary() {
            const subtotal = cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const delivery = cartItems.length > 0 ? 500 : 0;
            const discount = promoApplied ? Math.floor(subtotal * 0.1) : 0;
            const total = subtotal + delivery - discount;

            document.getElementById('subtotal').textContent = `${formatPrice(subtotal)} FCFA`;
            document.getElementById('delivery').textContent = `${formatPrice(delivery)} FCFA`;
            document.getElementById('discount').textContent = `-${formatPrice(discount)} FCFA`;
            document.getElementById('total').textContent = `${formatPrice(total)} FCFA`;
            
            discountAmount = discount;
        }

        function applyPromo() {
            const promoCode = document.getElementById('promoInput').value.toUpperCase().trim();
            
            if (!promoCode) {
                showNotification('Veuillez entrer un code promo', 'warning');
                return;
            }
            
            const validCodes = {
                'PROMO10': 10,
                'BIENVENUE': 10,
                'FASTFOOD2024': 15
            };
            
            if (validCodes[promoCode]) {
                if (promoApplied) {
                    showNotification('Un code promo est déjà appliqué', 'warning');
                } else {
                    promoApplied = true;
                    showNotification(`Code promo ${promoCode} appliqué ! ${validCodes[promoCode]}% de réduction.`, 'success');
                    updateSummary();
                }
            } else {
                showNotification('Code promo invalide', 'error');
            }
        }

        function checkout() {
            if (cartItems.length === 0) {
                showNotification('Votre panier est vide !', 'warning');
                return;
            }
            
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            
            if (!isLoggedIn) {
                if (confirm('Vous devez être connecté pour passer commande. Voulez-vous vous connecter ?')) {
                    localStorage.setItem('redirect_after_login', 'panier.html');
                    window.location.href = 'connexion.html';
                }
                return;
            }
            
            const orderDetails = {
                items: cartItems,
                subtotal: cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0),
                delivery: 500,
                discount: discountAmount,
                total: cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0) + 500 - discountAmount,
                date: new Date().toISOString()
            };
            
            let orders = JSON.parse(localStorage.getItem('fastfood_orders')) || [];
            orders.push({
                id: 'CMD-' + Date.now(),
                ...orderDetails,
                status: 'pending'
            });
            localStorage.setItem('fastfood_orders', JSON.stringify(orders));
            
            cartItems = [];
            saveCart();
            
            showNotification('✅ Commande passée avec succès !', 'success');
            
            setTimeout(() => {
                window.location.href = 'profil.html';
            }, 2000);
        }

        function showNotification(message, type = 'success') {
            const oldNotif = document.querySelector('.custom-notification');
            if (oldNotif) oldNotif.remove();
            
            const notification = document.createElement('div');
            notification.className = `custom-notification ${type}`;
            notification.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => notification.classList.add('show'), 10);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        renderCart();
    </script>
</body>
</html>
